[project]
name = "plasma-transfer"
version = "0.1.0"
description = "Cross-Machine Plasma Transfer Analysis: Transfer learning and domain shift in magnetic equilibrium reconstruction between DIII-D and MAST"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26.0,<2.2.0",
    "scipy>=1.12.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "umap-learn>=0.5.5",
    "datasets>=2.18.0",
    "huggingface-hub>=0.21.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sse-starlette>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "joblib>=1.3.2",
    "pot>=0.9.3",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[project.scripts]
plasma-transfer = "plasma_transfer.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/plasma_transfer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
